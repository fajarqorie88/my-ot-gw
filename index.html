*{box-sizing:border-box}html,body{margin:0}

.ch.tg{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.ch .tr{margin-left:auto;flex:none;transition:transform .2s ease}.ch.cl .tr{transform:rotate(-90deg)}.ch.cl{margin-bottom:-14px;border-radius:17px}.ch.cl~*{display:none}

<script>
const $=s=>document.querySelector(s),K='absenlembur:v1';
function fresh(){return{set:Object.assign({},S0,{hari:{},tunjangan:[]}),log:{},libur:[],ded:{},ins:{}}}
const S0={pokok:0,tunj:0,pola:5,mulai:'08:00',selesai:'17:00',ist:60,rnd:30};
let S=fresh(),tab='home',mo=new Date(),ed=null;
function rd(k){try{const r=localStorage.getItem(k);if(!r)return null;const o=JSON.parse(r);const st=Object.assign({},S0,{hari:{}},o.set||{});st.tunjangan=ntj(st);return{set:st,log:o.log||{},libur:o.libur||[],ded:nd(o.ded),ins:nd(o.ins)}}catch(e){return null}}
function save(){try{if(user)localStorage.setItem(K+':'+user.id,JSON.stringify(S))}catch(e){}}
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
let cl={tj:1,hr:1,lb:1};
function tgl(h,k){h.classList.toggle('cl');const c=h.classList.contains('cl');cl[k]=c?1:0;h.setAttribute('aria-expanded',c?'false':'true')}
let sv={st:'idle',p:0,m:'',t:'',fresh:false};
const HC=[['#6366f1','#a855f7'],['#d97706','#fbbf24'],['#0d9488','#2dd4bf'],['#ea580c','#fb923c'],['#2563eb','#38bdf8'],['#16a34a','#4ade80'],['#9333ea','#e879f9'],['#db2777','#f472b6'],['#dc2626','#fb7185']];
const hd=(t,n,k)=>{const c=HC[n]||HC[0],s='--h1:'+c[0]+';--h2:'+c[1];if(!k)return '<div class="ch" style="'+s+'"><b>'+t+'</b><i></i></div>';
 return '<div class="ch tg'+(cl[k]?' cl':'')+'" style="'+s+'" role="button" tabindex="0" aria-expanded="'+(cl[k]?'false':'true')+'" onclick="tgl(this,\''+k+'\')" onkeydown="if(event.key==\'Enter\'||event.key==\' \'){event.preventDefault();tgl(this,\''+k+'\')}"><b>'+t+'</b><i></i><svg class="tr" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 4h10L7 11z" style="fill:#fff"/></svg></div>'};
const tm=t=>{const a=String(t||'').split(':');return a.length<2?NaN:+a[0]*60+ +a[1]};
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID'),DAY=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const fm=m=>m<=0?'0 j':Math.floor(m/60)+' j'+(m%60?' '+m%60+' m':'');
const wage=()=>gajiT()/173;
const dd=k=>new Date(k+'T00:00:00');
const jm=k=>{const x=(S.set.hari||{})[dd(k).getDay()];return{m:x&&x.mulai||S.set.mulai,s:x&&x.selesai||S.set.selesai}};
function isOff(k){const w=dd(k).getDay();return S.libur.includes(k)||w==0||(+S.set.pola==5&&w==6)}
function mult(k,i){if(!isOff(k))return i==1?1.5:2;if(+S.set.pola==5)return i<=8?2:i==9?3:4;if(dd(k).getDay()==6)return i<=5?2:i==6?3:4;return i<=7?2:i==8?3:4}
function calc(k,r,now){const off=isOff(k);let m;
 if(r.spl&&!isNaN(tm(r.spl))){const bk=tm(r.brk);m=Math.max(0,tm(r.spl)-(isNaN(bk)?0:bk))}
 else{const a=tm(r.in);let b=r.out?tm(r.out):now;if(isNaN(a)||b==null||isNaN(b))return{m:0,rp:0,off,tul:0};if(b<a)b+=1440;
  if(off){m=b-a;if(m>300)m-=(+S.set.ist||0)}else m=b-Math.max(tm(jm(k).s),a);
  m=Math.max(0,m);const q=+S.set.rnd||1;m=Math.floor(m/q)*q}
 let t=0,rem=m,i=1;while(rem>0){t+=Math.min(60,rem)/60*mult(k,i);rem-=60;i++}return{m,rp:t*wage(),off,tul:t}}
function cal(k){const n=new Date();return calc(k,S.log[k]||{},ymd(n)==k?n.getHours()*60+n.getMinutes():null)}
function sum(pf){let m=0,r=0,u=0;for(const k in S.log)if(k.startsWith(pf)){const c=cal(k);m+=c.m;r+=c.rp;u+=c.tul||0}return{m,r,u}}
function weekMin(n){const d=new Date(n);d.setDate(d.getDate()-(d.getDay()+6)%7);let m=0;for(let i=0;i<7;i++){m+=cal(ymd(d)).m;d.setDate(d.getDate()+1)}return m}
function act(){const n=new Date(),k=ymd(n),r=S.log[k];if(!r)S.log[k]={in:hm(n)};else if(!r.out)r.out=hm(n);save();pushAtt(k);render()}
function go(t){tab=t;ed=null;if(sv.st=='ok'||sv.st=='err')sv.st='idle';scrollTo(0,0);render()}
function home(){const n=new Date(),k=ymd(n),r=S.log[k]||{},c=r.in?cal(k):{m:0,rp:0,off:isOff(k)},ms=sum(k.slice(0,7)),wk=weekMin(n),run=r.in&&!r.out,done=r.in&&r.out;
 const st=run?['Sedang bekerja','ok']:done?['Sudah pulang','bl']:['Belum absen','am'];
 const btn=done?'<div class="btn off">Selesai untuk hari ini</div>':'<button class="btn" onclick="act()">'+(run?'Absen pulang':'Absen masuk')+'</button>';
 const lim=!c.off&&c.m>240;
 return '<div class="hg"><div><div class="c" style="text-align:center;padding:14px">'+hd('Absen Hari Ini',0)+'<div class="lb">'+n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div><div style="font-size:46px;font-weight:500;line-height:1.2">'+hm(n)+'</div><span class="tg '+st[1]+'">'+st[0]+'</span>'+(c.off?'':'<div class="lb" style="margin-top:6px">Jam kerja hari ini '+jm(k).m+' - '+jm(k).s+'</div>')
 +'<div style="display:flex;justify-content:center;gap:30px;margin:14px 0"><div><div class="lb">Masuk</div><b style="font-weight:500">'+(r.in||'--:--')+'</b></div><div><div class="lb">Pulang</div><b style="font-weight:500">'+(r.out||'--:--')+'</b></div></div>'+btn+'</div></div><div>'
 +(wage()?'':'<div class="c"><span class="tg am">Perlu diisi</span><div style="margin-top:6px">Isi gaji di Pengaturan supaya uang lembur ikut terhitung.</div></div>')
 +'<div class="c">'+hd('Overtime Hari Ini',3)+(r.in&&c.off?'<div class="lb">Hari libur: semua jam kerja dihitung lembur</div>':'')+'<div class="big">'+(r.in?fm(c.m):'Belum ada')+'</div>'
 +(r.in&&wage()?'<div class="lb" style="font-size:13px">Estimasi sekitar '+rp(c.rp)+'</div>':'')
 +(r.in&&!c.off?'<div class="bar"><i style="width:'+Math.min(100,c.m/240*100)+'%"></i></div><div class="lb" style="margin-top:4px">Batas '+fm(240)+' per hari</div>':'')
 +(lim?'<div class="er">Sudah lewat batas 4 jam per hari.</div>':'')+'</div>'
 +'<div class="c">'+hd('Ringkasan Bulan Ini',2)+'<div class="g2"><div><div class="lb">Lembur bulan ini</div><div class="big">'+fm(ms.m)+'</div></div><div><div class="lb">Estimasi uang lembur</div><div class="big" style="font-size:19px;padding-top:2px">'+rp(ms.r)+'</div></div></div></div>'
 +'<div class="c">'+hd('Overtime Minggu Ini',7)+'<div style="display:flex;justify-content:flex-end"><span class="lb">'+fm(wk)+' dari 18 j</span></div><div class="bar"><i style="width:'+Math.min(100,wk/1080*100)+'%;background:'+(wk>1080?'var(--rdt)':'var(--ac)')+'"></i></div>'+(wk>1080?'<div class="er">Sudah lewat batas 18 jam per minggu.</div>':'')+'</div></div></div>'}
function mv(d){mo=new Date(mo.getFullYear(),mo.getMonth()+d,1);ed=null;render()}
function edit(k,nw){ed={k,nw:!!nw};render()}
function saveEd(){const k=s2d($('#ed_dt').value),i=$('#ed_i').value,o=$('#ed_o').value,sp=$('#ed_s').value,bk=$('#ed_b').value;if(!k||!i){$('#ed_e').textContent='Isi tanggal (dd/mm/yyyy) dan jam masuk dulu.';return}
 if(ed&&ed.k&&ed.k!=k&&!ed.nw){delete S.log[ed.k];delAtt(ed.k)}S.log[k]={in:i};if(o)S.log[k].out=o;if(sp){S.log[k].spl=sp;if(bk)S.log[k].brk=bk}save();pushAtt(k);ed=null;render()}
function delEd(){if(ed&&S.log[ed.k]){delete S.log[ed.k];save();delAtt(ed.k)}ed=null;render()}
function rekap(){const pf=mo.getFullYear()+'-'+pad(mo.getMonth()+1),ks=Object.keys(S.log).filter(k=>k.startsWith(pf)).sort().reverse(),t=sum(pf);
 let h='<div class="mh" style="display:flex;justify-content:space-between;align-items:center;padding:2px 4px 12px"><button class="b2 btn" style="width:42px;padding:6px" onclick="mv(-1)" aria-label="Bulan sebelumnya">&#8249;</button><h2>'+mo.toLocaleDateString('id-ID',{month:'long',year:'numeric'})+'</h2><button class="b2 btn" style="width:42px;padding:6px" onclick="mv(1)" aria-label="Bulan berikutnya">&#8250;</button></div>';
 if(ed){const r=S.log[ed.k]||{};h+='<div class="c">'+hd(ed.nw?'Tambah atau Koreksi Absen':'Koreksi Absen',4)+'<div class="fl"><span>Tanggal</span><div style="display:flex;gap:6px;align-items:center"><input type="text" id="ed_dt" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy" style="width:116px;text-align:right" value="'+d2s(ed.k)+'" oninput="fmtD(this)"><button type="button" class="btn b2" style="width:40px;padding:8px" onclick="pickD()" aria-label="Pilih tanggal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button><input type="date" id="ed_p" tabindex="-1" value="'+ed.k+'" onchange="if(this.value)$(\'#ed_dt\').value=d2s(this.value)" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px"></div></div><div class="fl"><span>Masuk</span><input type="time" id="ed_i" value="'+(r.in||'')+'"></div><div class="fl"><span>Pulang</span><input type="time" id="ed_o" value="'+(r.out||'')+'"></div><div class="fl"><span>SPL (jam:menit)</span><input type="time" id="ed_s" value="'+(r.spl||'')+'" oninput="netEd()"></div><div class="fl"><span>OT Break</span><input type="time" id="ed_b" value="'+(r.brk||'')+'" oninput="netEd()"></div><div class="fl"><span>Lembur bersih (SPL − Break)</span><b id="ed_n" style="font-weight:500">'+netTxt(r.spl,r.brk)+'</b></div><div id="ed_e" class="er"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="saveEd()">Simpan</button><button class="btn b2" onclick="edit(null);ed=null;render()">Batal</button>'+(!ed.nw&&S.log[ed.k]?'<button class="btn b2" style="color:var(--rdt)" onclick="delEd()">Hapus</button>':'')+'</div></div>'}
 h+='<div class="c">'+hd('Riwayat Absen',4);
 if(!ks.length)h+='<div style="padding:18px 0;text-align:center;color:var(--mu)">Belum ada absen di bulan ini.</div>';
 ks.forEach(k=>{const r=S.log[k],c=cal(k),d=dd(k),tag=c.off?'<span class="tg am">Libur · '+fm(c.m)+'</span>':c.m>0?'<span class="tg bl">Lembur '+fm(c.m)+'</span>':'<span class="tg nu">Tanpa lembur</span>';

let ding=null;
function sndUnlock(){try{ding=new Audio(DING);ding.volume=0;const p=ding.play();if(p&&p.then)p.then(()=>{ding.pause();ding.currentTime=0;ding.volume=1}).catch(()=>{ding.volume=1})}catch(e){}}
function sndPlay(){try{if(!ding)ding=new Audio(DING);ding.pause();ding.currentTime=0;ding.volume=1;const p=ding.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function svCard(){const run=sv.st=='run',ok=sv.st=='ok',er=sv.st=='err';
 return '<div class="c">'+hd('Save Data',6)+'<div class="lb" style="margin-bottom:10px">Kirim semua data absen, pengaturan, dan hari libur ke server.</div>'
 +(run?'<div class="btn off">Menyimpan...</div>':'<button class="btn" onclick="svd()">Save Data</button>')
 +((run||ok)?'<div class="bar" style="height:8px"><i id="svb" style="width:'+sv.p+'%;transition:width .3s ease"></i></div><div class="lb" id="svp" style="margin-top:4px;text-align:right">'+sv.p+'%</div>':'')
 +(ok?'<svg class="ck'+(sv.fresh?' an':'')+'" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="24"/><path d="M17 29l8 8 14-16"/></svg><div style="text-align:center;font-weight:500;color:var(--okt)">Data tersimpan</div>':'')
 +(er?'<div class="er" style="text-align:center">'+esc(sv.m)+'</div>':'')
 +(sv.t&&!run?'<div class="lb" style="text-align:center;margin-top:8px">Terakhir disimpan '+sv.t+'</div>':'')+'</div>'}
async function svd(){if(sv.st=='run')return;
 if(!user||!sb){sv.st='err';sv.m='Belum login atau tidak terhubung ke server.';return render()}
 sndUnlock();sv.st='run';sv.p=0;sv.m='';render();
 const rows=Object.keys(S.log).filter(k=>S.log[k]&&S.log[k].in).map(attRow),ch=[];for(let i=0;i<rows.length;i+=200)ch.push(rows.slice(i,i+200));
 const tot=2+ch.length,wt=ms=>new Promise(r=>setTimeout(r,ms)),chk=r=>{if(r&&r.error)throw r.error};let dn=0;
 const adv=async()=>{dn++;sv.p=Math.round(dn/tot*100);const b=$('#svb'),t=$('#svp');if(b)b.style.width=sv.p+'%';if(t)t.textContent=sv.p+'%';await wt(250)};
 try{clearTimeout(st);
  chk(await sb.from('settings').upsert(setRow()));await adv();
  const up=async c=>{const oc={onConflict:'user_id,tanggal'};let r=await sb.from('attendance').upsert(c,oc);if(r&&r.error&&/jam_spl|ot_break/.test(r.error.message||'')){spCol=false;c=c.map(x=>{const y=Object.assign({},x);delete y.jam_spl;delete y.ot_break;return y});r=await sb.from('attendance').upsert(c,oc)}return r};
  for(const c of ch){chk(await up(c));await adv()}
  chk(S.libur.length?await sb.from('holidays').upsert(S.libur.map(v=>({user_id:user.id,tanggal:v})),{onConflict:'user_id,tanggal'}):0);await adv();
  sv.st='ok';sv.p=100;sv.t=hm(new Date());sv.fresh=true;render();sv.fresh=false;sndPlay()
 }catch(e){sv.st='err';sv.m=em(e)||'Gagal menyimpan ke server.';render()}}
const ff=()=>[...document.querySelectorAll('#v input:not([type=hidden]):not([disabled]):not([tabindex="-1"]),#v select:not([disabled])')].filter(x=>x.offsetParent!==null);
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!='Enter'||e.isComposing||!t||!/^(INPUT|SELECT)$/.test(t.tagName)||!t.closest('#v')||t.getAttribute('onkeydown'))return;e.preventDefault();const f=ff(),i=f.indexOf(t);if(i<0||i>=f.length-1){t.blur();return}const n=f[i+1];n.focus();if(n.select&&n.type!='date'&&n.type!='time')try{n.select()}catch(x){}setTimeout(()=>{if(!document.activeElement||document.activeElement===document.body){const g=ff();if(g[i+1])g[i+1].focus()}},50)});
setInterval(()=>{if(user&&auth.ready&&tab=='home'&&document.visibilityState=='visible')render()},30000);
render();
