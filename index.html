function note(t){const n=$('#nt');n.textContent=t;n.style.display=t?'block':'none';clearTimeout(note.t);if(t)note.t=setTimeout(()=>note(''),4000)}
const sy=p=>Promise.resolve(p).then(r=>{if(r&&r.error)throw r.error}).catch(()=>note('Gagal menyimpan ke server. Cek koneksi.'));
const attRow=k=>({user_id:user.id,tanggal:k,jam_masuk:S.log[k].in,jam_pulang:S.log[k].out||null});
const setRow=()=>{const s=S.set;return{user_id:user.id,pokok:+s.pokok||0,tunj:+s.tunj||0,pola:+s.pola,mulai:s.mulai||'08:00',selesai:s.selesai||'17:00',istirahat:+s.ist||0,pembulatan:+s.rnd||30,hari:s.hari||{},deduksi:S.ded||[],updated_at:new Date().toISOString()}};
function pushAtt(k){if(user&&S.log[k])sy(sb.from('attendance').upsert(attRow(k),{onConflict:'user_id,tanggal'}))}
function delAtt(k){if(user)sy(sb.from('attendance').delete().eq('user_id',user.id).eq('tanggal',k))}
function pushSet(){if(!user)return;clearTimeout(st);st=setTimeout(()=>sy(sb.from('settings').upsert(setRow())),600)}
function pushLb(v){if(user)sy(sb.from('holidays').upsert({user_id:user.id,tanggal:v},{onConflict:'user_id,tanggal'}))}
function delLbR(v){if(user)sy(sb.from('holidays').delete().eq('user_id',user.id).eq('tanggal',v))}
async function pull(){auth.ready=false;render();
 try{const[a,s,h]=await Promise.all([sb.from('attendance').select('tanggal,jam_masuk,jam_pulang'),sb.from('settings').select('*').maybeSingle(),sb.from('holidays').select('tanggal')]);
  const er=a.error||s.error||h.error;if(er)throw er;
  const log={},d=s.data,set=Object.assign({},S0,{hari:{}});
  a.data.forEach(x=>{log[x.tanggal]={in:String(x.jam_masuk).slice(0,5)};if(x.jam_pulang)log[x.tanggal].out=String(x.jam_pulang).slice(0,5)});
  if(d)Object.assign(set,{pokok:+d.pokok,tunj:+d.tunj,pola:d.pola,mulai:String(d.mulai).slice(0,5),selesai:String(d.selesai).slice(0,5),ist:d.istirahat,rnd:d.pembulatan,hari:d.hari||{}});
  S={set,log,libur:h.data.map(x=>x.tanggal).sort(),ded:d&&d.deduksi||[]};save();
  let done=null;try{done=localStorage.getItem(IK())}catch(e){}
  auth.imp=!d&&!a.data.length&&!h.data.length&&!!lg()&&!done;
 }catch(e){note('Gagal memuat data dari server. Menampilkan data terakhir di perangkat ini.')}
 auth.ready=true;render()}
async function imp(y){auth.imp=false;
 if(!y){try{localStorage.setItem(IK(),'1')}catch(e){}return render()}
 const o=lg();if(!o)return render();S=o;save();render();
 try{const u=user.id,t=Object.keys(S.log).map(attRow),x=await Promise.all([sb.from('settings').upsert(setRow()),t.length?sb.from('attendance').upsert(t,{onConflict:'user_id,tanggal'}):0,S.libur.length?sb.from('holidays').upsert(S.libur.map(v=>({user_id:u,tanggal:v})),{onConflict:'user_id,tanggal'}):0]),e=x.find(z=>z&&z.error);
  if(e)throw e.error;try{localStorage.setItem(IK(),'1')}catch(e){}note('Data lama berhasil diimpor.')}catch(e){auth.imp=true;note('Gagal impor. Coba lagi nanti.')}
 render()}
function impCard(){return '<div class="c"><b style="font-weight:500">Ada data lama di perangkat ini</b><div class="lb" style="margin:4px 0 10px">Mau diimpor ke akunmu? Ini cuma ditawarkan sekali.</div><div style="display:flex;gap:8px"><button class="btn" onclick="imp(1)">Impor</button><button class="btn b2" onclick="imp(0)">Lewati</button></div></div>'}
const em=x=>{const m=String(x&&x.message||x||'');return /invalid login/i.test(m)?'Email atau password salah.':/not confirmed/i.test(m)?'Email belum dikonfirmasi. Cek inbox kamu.':/already registered/i.test(m)?'Email ini sudah terdaftar. Silakan masuk.':/rate limit|too many/i.test(m)?'Terlalu banyak percobaan. Coba lagi nanti.':/fetch|network/i.test(m)?'Tidak ada koneksi internet.':/password/i.test(m)?'Password terlalu lemah atau tidak valid.':m||'Terjadi kesalahan.'};
function am(m){auth.mode=m;auth.err=auth.msg='';render()}
async function sa(){if(!sb){auth.err='Tidak bisa terhubung ke server.';return render()}
 const e=($('#a_e').value||'').trim(),p=$('#a_p').value;auth.em=e;auth.err=auth.msg='';
 if(!e||!p){auth.err='Isi email dan password dulu.';return render()}
 if(auth.mode=='up'&&p.length<6){auth.err='Password minimal 6 karakter.';return render()}
 auth.busy=true;render();
 try{if(auth.mode=='up'){const r=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;
   if(!r.data.session){if(r.data.user&&r.data.user.identities&&!r.data.user.identities.length)auth.err='Email ini sudah terdaftar. Silakan masuk.';else{auth.msg='Akun dibuat. Cek email kamu, klik link konfirmasi, lalu masuk.';auth.mode='in'}}}
  else{const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error}
 }catch(x){auth.err=em(x)}
 auth.busy=false;render()}
async function out(){const id=user&&user.id;try{await sb.auth.signOut()}catch(e){}
 try{localStorage.removeItem(K+':'+id)}catch(e){}S=fresh();user=null;tab='home';auth.imp=false;auth.ready=true;render()}
function login(){const up=auth.mode=='up',ip='width:100%;margin-bottom:8px;text-align:left';
 return '<div class="c" style="margin-top:6vh;padding:18px 14px"><div style="display:flex;justify-content:center;margin-bottom:6px">'+LOGO(56)+'</div><h2 style="text-align:center;font-size:22px">My OT</h2><div class="lb" style="text-align:center;margin:2px 0 12px">'+(up?'Buat akun baru':'Masuk ke akunmu')+'</div>'
 +'<div class="sg" style="margin:0 0 12px"><button class="'+(up?'':'on')+'" onclick="am(\'in\')">Masuk</button><button class="'+(up?'on':'')+'" onclick="am(\'up\')">Daftar</button></div>'
 +'<input type="email" id="a_e" placeholder="Email" autocomplete="email" value="'+esc(auth.em)+'" style="'+ip+'">'
 +'<input type="password" id="a_p" placeholder="Password'+(up?' (min. 6 karakter)':'')+'" autocomplete="'+(up?'new-password':'current-password')+'" onkeydown="if(event.key==\'Enter\')sa()" style="'+ip+'">'
 +(auth.err?'<div class="er" style="margin:0 0 8px">'+esc(auth.err)+'</div>':'')
 +(auth.msg?'<div class="tg ok" style="display:block;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px;font-weight:400">'+esc(auth.msg)+'</div>':'')
 +'<button class="btn'+(auth.busy?' off':'')+'" '+(auth.busy?'disabled':'onclick="sa()"')+'>'+(auth.busy?'Memproses...':up?'Daftar':'Masuk')+'</button></div>'}
const HN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const LOGO=s=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg'+s+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg'+s+')"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M16 11.5V16l3.2 2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 5.5v4M23 7.5h4" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round"/></svg>';
function hariCard(){const h=S.set.hari||{},ks=Object.keys(h).sort((a,b)=>(+a||7)-(+b||7)),av=[1,2,3,4,5,6,0].filter(d=>!(d in h));
 return '<div class="c"><b style="font-weight:500">Jam kerja per hari</b><div class="lb">Tambah hari yang jamnya beda dari default, misalnya Jumat.</div>'
 +ks.map(d=>'<div class="fl"><b style="font-weight:500;width:64px">'+HN[d]+'</b><span style="display:flex;gap:6px;align-items:center"><input type="time" style="width:108px" value="'+h[d].mulai+'" onchange="hs('+d+',\'mulai\',this.value)"><input type="time" style="width:108px" value="'+h[d].selesai+'" onchange="hs('+d+',\'selesai\',this.value)"><button class="b2" style="border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--mu)" onclick="hdel('+d+')" aria-label="Hapus">&#10005;</button></span></div>').join('')
 +(av.length?'<div style="display:flex;gap:8px;margin-top:10px"><select id="hh" style="flex:1">'+av.map(d=>'<option value="'+d+'">'+HN[d]+'</option>').join('')+'</select><button class="btn b2" style="width:auto;padding:8px 14px" onclick="ha()">Tambah hari</button></div>':'')+'</div>'}
function ha(){const d=+$('#hh').value;S.set.hari=S.set.hari||{};S.set.hari[d]={mulai:S.set.mulai,selesai:S.set.selesai};save();pushSet();render()}
function hs(d,f,v){if(v&&S.set.hari[d]){S.set.hari[d][f]=v;save();pushSet()}}
function hdel(d){delete S.set.hari[d];save();pushSet();render()}
const dedAmt=(d,l,g)=>d.tipe=='nom'?+d.nilai:(+d.nilai/100)*(d.tipe=='pl'?l:g);
const row=(l,v)=>'<div class="fl"><span class="lb" style="font-size:14px">'+l+'</span><span style="font-size:14px">'+(v<0?'- '+rp(-v):rp(v))+'</span></div>';
function dedCard(t){const g=(+S.set.pokok||0)+(+S.set.tunj||0),ds=S.ded||[],tot=ds.reduce((a,d)=>a+dedAmt(d,t.r,g),0);
 return '<div class="c"><b style="font-weight:500">Deduction</b><div class="lb">Potongan ini berlaku setiap bulan.</div>'
 +ds.map(d=>'<div class="fl"><div style="min-width:0"><div style="font-size:14px">'+esc(d.nama)+'</div><div class="lb">'+(d.tipe=='nom'?rp(d.nilai):d.nilai+'% dari '+(d.tipe=='pl'?'lembur':'gaji'))+'</div></div><span style="display:flex;align-items:center;gap:8px"><span style="font-size:14px">- '+rp(dedAmt(d,t.r,g))+'</span><button class="b2" style="border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--mu)" onclick="dedDel(\''+d.id+'\')" aria-label="Hapus">&#10005;</button></span></div>').join('')
 +'<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input id="dn" placeholder="Nama (mis. Pajak)" style="flex:2 1 130px"><select id="dt" style="flex:1 1 120px"><option value="nom">Nominal (Rp)</option><option value="pl">% dari lembur</option><option value="pg">% dari gaji</option></select><input id="dv" type="number" inputmode="decimal" placeholder="Nilai" style="flex:1 1 80px"></div><div id="de" class="er"></div><button class="btn b2" style="margin-top:8px" onclick="dedAdd()">Tambah potongan</button></div>'
 +'<div class="c">'+row('Gaji (pokok + tunjangan)',g)+row('Lembur bulan ini',t.r)+row('Total potongan',-tot)+'<div class="fl"><b style="font-weight:500">Estimasi bersih</b><b style="font-weight:500;font-size:17px">'+rp(g+t.r-tot)+'</b></div></div>'}
function dedAdd(){const n=$('#dn').value.trim(),t=$('#dt').value,v=+$('#dv').value;if(!n||!(v>0)){$('#de').textContent='Isi nama dan nilai dulu.';return}if(t!='nom'&&v>100){$('#de').textContent='Persentase maksimal 100.';return}
 (S.ded=S.ded||[]).push({id:Date.now().toString(36),nama:n,tipe:t,nilai:v});save();pushSet();render()}
function dedDel(id){S.ded=(S.ded||[]).filter(d=>d.id!=id);save();pushSet();render()}
function render(){const v=!auth.ready?'<div class="c" style="text-align:center;margin-top:20vh;color:var(--mu)">Memuat...</div>':!user?login():(auth.imp?impCard():'')+(tab=='home'?home():tab=='rekap'?rekap():set());
 $('#v').innerHTML=v;$('#v').className=tab=='home'?'':'nar';const hdr=$('#hd');hdr.style.display=user&&auth.ready?'':'none';if(!hdr.firstChild)hdr.innerHTML=LOGO(32)+'<span>My OT</span>';document.querySelector('nav').style.display=user&&auth.ready?'':'none';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
if(sb)sb.auth.onAuthStateChange((e,s)=>{const u=s&&s.user||null;if(e!='INITIAL_SESSION'&&(u&&u.id)==(user&&user.id))return;user=u;
 if(u)S=rd(K+':'+u.id)||fresh();
 setTimeout(()=>{if(u)pull();else{auth.ready=true;render()}},0)});else auth.ready=true;
setInterval(()=>{if(user&&auth.ready&&tab=='home'&&document.visibilityState=='visible')render()},30000);
render();
</script></body></html>
